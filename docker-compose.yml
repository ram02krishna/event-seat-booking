services:
  postgres:
    image: postgres:16-alpine
    container_name: seat_lock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seat_lock
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_lock"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seat_lock_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["app", "full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: seat_lock_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      # Local stack over plain http://localhost. NODE_ENV=production would make the API refuse to
      # start (it requires a unique JWT secret, https origins and Resend credentials).
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seat_lock?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretdevkey1234567890_min32chars
      CLIENT_URL: http://localhost:3000,http://localhost:3001
    ports:
      - "${DOCKER_API_PORT:-4000}:4000"

  web:
    profiles: ["app", "full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${DOCKER_API_PORT:-4000}
        NEXT_PUBLIC_SOCKET_URL: http://localhost:${DOCKER_API_PORT:-4000}
    container_name: seat_lock_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:${DOCKER_API_PORT:-4000}
      NEXT_PUBLIC_SOCKET_URL: http://localhost:${DOCKER_API_PORT:-4000}
    ports:
      - "${DOCKER_WEB_PORT:-3001}:3000"

volumes:
  postgres_data:
  redis_data:
